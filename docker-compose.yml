services:
  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL_DOCKER}
      - SECRET_KEY=${SECRET_KEY}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - AIRFLOW_API_URL=${AIRFLOW_API_URL:-http://host.docker.internal:8080}
      - AIRFLOW_USERNAME=${AIRFLOW_USERNAME:-airflow}
      - AIRFLOW_PASSWORD=${AIRFLOW_PASSWORD:-airflow}
      - AIRFLOW_SCRAPER_DAG_ID=${AIRFLOW_SCRAPER_DAG_ID:-unified_pipeline_dag}
      - AIRFLOW_EMBEDDING_DAG_ID=${AIRFLOW_EMBEDDING_DAG_ID:-embedding_pipeline_dag}
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]