[project]
name = "webscraping-data-api"
version = "0.1.0"
description = "This is a api layer of the webscraping data of vijaysales"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.3",
    "torch>=2.2.2,<2.3.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.128.5",
    "httpx>=0.28.1",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-jose[cryptography]>=3.5.0",
    "pgvector>=0.3.6",
    "sentence-transformers>=2.7.0,<3.0.0",
    "sqlalchemy>=2.0.46",
    "uvicorn[standard]>=0.40.0",
    "numpy<2",
    "pandas",
    "ollama>=0.6.1",
]

[tool.uv]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]
