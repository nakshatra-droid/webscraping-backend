<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>My Dashboard — WebScraping API</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/style.css" />
</head>

<body>
    <div id="toast-container"></div>

    <!-- Product Detail Modal -->
    <div id="product-detail-modal" class="modal-overlay hidden">
        <div class="modal modal-lg">
            <div class="modal-header">
                <h3 id="pd-title">Product Detail</h3><button class="modal-close"
                    onclick="closeModal('product-detail-modal')">✕</button>
            </div>
            <div class="modal-body" id="pd-body"></div>
        </div>
    </div>

    <!-- ═══ LAYOUT ═══ -->
    <div class="layout">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-logo">🛍️</div>
                <div>
                    <div class="brand-name">My Dashboard</div>
                    <div class="brand-sub">User Panel</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section-label">Browse</div>
                <div class="nav-item active" onclick="showSection('products')">
                    <span class="nav-icon">⭐</span><span class="nav-label">Products</span>
                </div>
                <div class="nav-item" onclick="showSection('chatbot')">
                    <span class="nav-icon">🤖</span><span class="nav-label">Product Chatbot</span>
                </div>
                <div class="nav-item" onclick="showSection('compare')">
                    <span class="nav-icon">⚖️</span><span class="nav-label">Compare Products</span>
                </div>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="sidebar-avatar">U</div>
                    <div class="user-meta">
                        <div class="u-name" id="sidebar-username">User</div>
                        <div class="u-role">USER</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- TOPBAR -->
        <div class="topbar">
            <span class="topbar-title" id="topbar-title">Products</span>
            <div class="topbar-actions">
                <button class="btn btn-secondary btn-sm" onclick="logout()">🚪 Logout</button>
                <button id="admin-dashboard-btn" class="btn btn-primary btn-sm" style="display:none;margin-left:8px"
                    onclick="goToAdminDashboard()">Admin Dashboard</button>
            </div>
        </div>

        <!-- MAIN -->
        <main class="main-content">
            <div class="page-content">

                <!-- ── PREFERRED PRODUCTS ── -->
                <div id="section-products" class="section active">
                    <div class="section-title">Products</div>
                    <div class="section-subtitle">Browse laptops and compare prices across marketplaces.</div>
                    <div style="display:flex;gap:8px;align-items:center;margin-bottom:16px">
                        <input id="products-search" class="form-control" style="max-width:300px"
                            placeholder="Search by model, brand, or processor" />
                        <button class="btn btn-secondary btn-sm" onclick="searchProducts()">Search</button>
                        <button class="btn btn-ghost btn-sm" onclick="clearProductsSearch()">Clear</button>
                    </div>
                    <div id="products-grid" class="products-grid"></div>
                    <div id="products-pagination"></div>
                    <div id="products-loading" style="text-align:center;padding:40px;color:var(--text-muted)">
                        <div class="spinner spinner-dark" style="width:32px;height:32px;margin:0 auto 12px"></div>
                        <p>Loading products…</p>
                    </div>
                </div>

                <!-- ── CHATBOT ── -->
                <div id="section-chatbot" class="section">
                    <div class="chat-layout"
                        style="display:grid;grid-template-columns:240px 1fr;gap:12px;height:calc(100vh - var(--nav-h) - 48px)">
                        <div
                            style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden">
                            <div style="padding:12px;border-bottom:1px solid var(--border)">
                                <button class="btn btn-primary btn-sm" style="width:100%"
                                    onclick="createNewChatSession()">+ New Chat</button>
                            </div>
                            <div id="chat-sessions-list" style="overflow-y:auto;padding:8px"></div>
                        </div>
                        <div class="chat-wrap">
                            <div class="chat-header">
                                <div class="chat-avatar">🤖</div>
                                <div class="chat-info">
                                    <div class="chat-name">Product AI</div>
                                    <div class="chat-status" id="chat-status-text">Connecting…</div>
                                </div>
                                <div style="margin-left:auto;display:flex;gap:8px">
                                    <button class="btn btn-secondary btn-sm" onclick="reconnectWS()" id="reconnect-btn"
                                        style="display:none">↩ Reconnect</button>
                                    <button class="btn btn-ghost btn-sm" onclick="clearChat()">🗑 Clear</button>
                                </div>
                            </div>
                            <div class="chat-messages" id="chat-messages"></div>
                            <div class="chat-input-wrap">
                                <input id="chat-input" class="chat-input"
                                    placeholder="Ask about products… (press Enter to send)" disabled />
                                <button class="btn btn-primary btn-icon" id="chat-send-btn" onclick="sendChatMessage()"
                                    disabled>
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                        <line x1="22" y1="2" x2="11" y2="13" />
                                        <polygon points="22 2 15 22 11 13 2 9 22 2" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ── COMPARE PRODUCTS ── -->
                <div id="section-compare" class="section">
                    <div class="section-title">Compare Products</div>
                    <div class="section-subtitle">Select up to 4 laptops and compare specs side by side.</div>
                    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
                        <select id="compare-brand-select" class="form-control" style="max-width:200px"
                            onchange="onCompareBrandChange()">
                            <option value="">Select Brand…</option>
                        </select>
                        <select id="compare-product-select" class="form-control" style="max-width:280px">
                            <option value="">— select brand first —</option>
                        </select>
                        <button class="btn btn-secondary btn-sm" onclick="addFromDropdown()">Add</button>
                        <button class="btn btn-ghost btn-sm" onclick="clearCompare()">Clear</button>
                        <button class="btn btn-primary btn-sm" onclick="runCompare()">Compare</button>
                    </div>
                    <div id="compare-list" style="margin-bottom:16px;min-height:28px"></div>
                    <div id="compare-table"></div>
                </div>

            </div>
        </main>
    </div>

    <script>
        // Make quick query buttons work
        function sendQuickQuery(query) {
            const input = document.getElementById('chat-input');
            input.value = query;
            sendChatMessage();
        }

        //  SHARED
        const API = '/api/v1';
        let token = localStorage.getItem('access_token');
        const role = localStorage.getItem('role');

        // Show Admin Dashboard button only for admin role
        window.addEventListener('DOMContentLoaded', function () {
            if (role === 'ADMIN') {
                document.getElementById('admin-dashboard-btn').style.display = '';
            }
        });

        function goToAdminDashboard() {
            window.location.href = '/ui/admin/dashboard';
        }

        if (!token) { window.location.href = '/ui/login'; }

        document.getElementById('sidebar-username').textContent = localStorage.getItem('username') || 'User';
        document.getElementById('sidebar-avatar').textContent = (localStorage.getItem('username') || 'U')[0].toUpperCase();

        function authHeaders() { return { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }; }
        async function apiFetch(path, opts = {}) {
            const res = await fetch(API + path, { headers: authHeaders(), ...opts });
            if (res.status === 401) { localStorage.clear(); window.location.href = '/ui/login'; return null; }
            return res;
        }
        function showToast(msg, type = 'info') {
            const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            el.innerHTML = `<span class="toast-icon">${icons[type]}</span><span>${msg}</span>`;
            el.onclick = () => { el.classList.add('out'); setTimeout(() => el.remove(), 220); };
            document.getElementById('toast-container').appendChild(el);
            setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 220); }, 4000);
        }
        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        document.querySelectorAll('.modal-overlay').forEach(el => {
            el.addEventListener('click', e => { if (e.target === el) el.classList.add('hidden'); });
        });
        function fmtDate(d) { return d ? new Date(d).toLocaleString() : '—'; }
        function fmtPrice(p) { return p != null ? '₹' + Number(p).toLocaleString() : '—'; }
        function normalizeProductName(brand, series) {
            const b = (brand || '').trim();
            const s = (series || '').trim();
            if (!b && !s) return '—';
            if (!b) return s;
            if (!s) return b;

            const bLower = b.toLowerCase();
            let cleanSeries = s;
            if (s.toLowerCase().startsWith(bLower)) {
                cleanSeries = s.slice(b.length).trim();
            }

            return [b, cleanSeries].filter(Boolean).join(' ');
        }

        function normalizeProcessor(processor) {
            const p = (processor || '').trim();
            if (!p) return '—';

            // Remove duplicated leading word, e.g. "Intel Intel Core i5" -> "Intel Core i5"
            const parts = p.split(/\s+/);
            if (parts.length >= 2 && parts[0].toLowerCase() === parts[1].toLowerCase()) {
                return [parts[0], ...parts.slice(2)].join(' ').trim();
            }
            return p;
        }

        function showSection(name) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(`section-${name}`).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => {
                if (n.getAttribute('onclick')?.includes(`'${name}'`)) n.classList.add('active');
            });
            const titles = { 'products': 'Products', 'chatbot': 'Product Chatbot', 'compare': 'Compare Products' };
            document.getElementById('topbar-title').textContent = titles[name] || name;
            if (name === 'chatbot') ensureChatReady();
            if (name === 'compare') { renderCompareList(); loadCompareDropdowns(); }
        }

        function makePagination(container, total, page, size, cb) {
            const pages = Math.ceil(total / size) || 1;
            const el = document.getElementById(container);
            if (!el || total === 0) { if (el) el.innerHTML = ''; return; }
            let html = `<div class="pagination"><span class="page-info">${total} items · page ${page}/${pages}</span>`;
            html += `<button onclick="(${cb})(1)" ${page <= 1 ? 'disabled' : ''}>«</button>`;
            html += `<button onclick="(${cb})(${page - 1})" ${page <= 1 ? 'disabled' : ''}>‹</button>`;
            for (let p = Math.max(1, page - 2); p <= Math.min(pages, page + 2); p++)
                html += `<button class="${p === page ? 'active' : ''}" onclick="(${cb})(${p})">${p}</button>`;
            html += `<button onclick="(${cb})(${page + 1})" ${page >= pages ? 'disabled' : ''}>›</button>`;
            html += `<button onclick="(${cb})(${pages})" ${page >= pages ? 'disabled' : ''}>»</button></div>`;
            el.innerHTML = html;
        }

        //  PRODUCTS
        let productsPage = 1;
        let productsSearchTerm = '';

        function searchProducts() {
            productsSearchTerm = document.getElementById('products-search').value.trim();
            loadProducts(1);
        }

        function clearProductsSearch() {
            productsSearchTerm = '';
            document.getElementById('products-search').value = '';
            loadProducts(1);
        }

        async function loadProducts(page = 1) {
            productsPage = page;
            const loadingEl = document.getElementById('products-loading');
            const gridEl = document.getElementById('products-grid');
            loadingEl.style.display = 'block'; gridEl.innerHTML = '';

            const searchParam = productsSearchTerm ? `&search=${encodeURIComponent(productsSearchTerm)}` : '';
            const res = await apiFetch(`/products/?page=${page}&size=15${searchParam}`);
            loadingEl.style.display = 'none';
            if (!res?.ok) { showToast('Failed to load products', 'error'); return; }
            const data = await res.json();

            if (!data.data?.length) {
                gridEl.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
            <div class="empty-icon">📦</div><p>No products yet.</p></div>`;
                document.getElementById('products-pagination').innerHTML = '';
                return;
            }

            gridEl.innerHTML = data.data.map(p => {
                const brandSeries = normalizeProductName(p.brand, p.series);
                const priceText = p.min_price != null ? fmtPrice(p.min_price) : '';
                const priceTextmax = p.max_price != null ? (p.max_price == p.min_price ? '' : ` - ${fmtPrice(p.max_price)}`) : '';
                const sources = (p.sources || []).join(', ') || '—';
                const imgHtml = p.image_url
                    ? `<img class="prod-img" src="${p.image_url}" alt="${brandSeries}"  />`
                    : `<div class="prod-img">💻</div>`;
                return `<div class="product-card" onclick="viewProduct('${p.id}')">
            ${imgHtml}
            <div class="prod-body">
                <div class="prod-name">${brandSeries}</div>
                <div class="prod-meta">
                    <span class="prod-price">${priceText}${priceTextmax}</span>
                </div>
                <div class="prod-footer">
                    <span style="font-size:11px;color:var(--text-muted)">${sources}</span>
                </div>
            </div>
        </div>`;
            }).join('');

            makePagination('products-pagination', data.total, page, 15, 'loadProducts');
        }

        async function viewProduct(id) {
            const res = await apiFetch(`/products/${id}`);
            if (!res?.ok) { showToast('Failed to load product', 'error'); return; }
            const json = await res.json(); const p = json.data;
            const brandSeries = normalizeProductName(p.brand, p.series);
            const firstImageUrl = (p.product_details || []).find(d => d.image_url)?.image_url || null;
            const modalImage = firstImageUrl
                ? `<img src="${firstImageUrl}" alt="${brandSeries}" style="width:200px;height:200px;object-fit:contain;border-radius:12px;border:1px solid #e6e7eb" />`
                : `<div class="prod-img" style="width:96px;height:96px;display:flex;align-items:center;justify-content:center;font-size:38px">💻</div>`;
            const listings = (p.product_details || []).map(d => `
        <tr>
            <td>${d.source}</td>
            <td>${d.price != null ? fmtPrice(d.price) : '—'}</td>
            <td>${d.discount != null ? d.discount + '%' : '—'}</td>
            <td>${d.rating != null ? d.rating : '—'}</td>
            <td>${d.review_count ?? '—'}</td>
            <td><a href="${d.url}" target="_blank" style="color:var(--accent)">Open</a></td>
        </tr>`).join('');

            document.getElementById('pd-title').textContent = brandSeries || 'Product Detail';
            document.getElementById('pd-body').innerHTML = `
        <div style="display:flex;justify-content:center;margin-bottom:12px">${modalImage}</div>
        <table class="detail-table">
            <tr><td>Model Number</td><td><strong>${p.model_number}</strong></td></tr>
            <tr><td>Name</td><td>${brandSeries}</td></tr>
            <tr><td>Processor</td><td>${normalizeProcessor(p.processor)}</td></tr>
            <tr><td>RAM</td><td>${p.ram || '—'}</td></tr>
            <tr><td>Storage</td><td>${p.storage || '—'}</td></tr>
            <tr><td>Screen Size</td><td>${p.screen_size || '—'}</td></tr>
            <tr><td>Graphics</td><td>${p.graphic_processor || '—'}</td></tr>
            <tr><td>Colour</td><td>${p.colour || '—'}</td></tr>
        </table>
        <h4 style="margin:16px 0 10px;font-size:14px">Listings</h4>
        <table class="detail-table">
            <tr style="
    text-align: left;
"><th>Source</th><th>Price</th><th>Discount</th><th>Rating</th><th>Reviews</th><th>Link</th></tr>
            ${listings || '<tr><td colspan="6">No listings yet.</td></tr>'}
        </table>`;
            openModal('product-detail-modal');
        }

        //  COMPARE PRODUCTS
        const compareIds = [];
        const compareNames = {};
        let allProductsCache = [];

        async function loadCompareDropdowns() {
            if (allProductsCache.length) { populateBrandDropdown(); return; }
            // Keep size within backend max page size limits.
            let res = await apiFetch('/products/?page=1&size=100');
            if (!res?.ok) {
                res = await apiFetch('/products/?page=1&size=15');
            }
            if (!res?.ok) {
                showToast('Failed to load brands', 'error');
                return;
            }
            const data = await res.json();
            allProductsCache = data.data || [];
            populateBrandDropdown();
        }

        function populateBrandDropdown() {
            const brands = [...new Set(allProductsCache.map(p => p.brand).filter(Boolean))].sort();
            const sel = document.getElementById('compare-brand-select');
            sel.innerHTML = '<option value="">Select Brand…</option>' + brands.map(b => `<option value="${b}">${b}</option>`).join('');
            document.getElementById('compare-product-select').innerHTML = '<option value="">— select brand first —</option>';
        }

        function onCompareBrandChange() {
            const brand = document.getElementById('compare-brand-select').value;
            const products = allProductsCache.filter(p => p.brand === brand);
            const sel = document.getElementById('compare-product-select');
            sel.innerHTML = '<option value="">Select Laptop…</option>' + products.map(p => {
                const name = normalizeProductName(p.brand, p.series);
                return `<option value="${p.id}">${name}</option>`;
            }).join('');
        }

        function addFromDropdown() {
            const id = document.getElementById('compare-product-select').value;
            if (!id) { showToast('Select a laptop first', 'warning'); return; }
            const product = allProductsCache.find(p => p.id === id);
            if (product) addToCompare(product.id, normalizeProductName(product.brand, product.series));
        }

        function renderCompareList() {
            const el = document.getElementById('compare-list');
            if (!compareIds.length) {
                el.innerHTML = '<span style="color:var(--text-muted);font-size:13px">No products selected.</span>';
                return;
            }
            el.innerHTML = compareIds.map(id => {
                const name = compareNames[id] || id;
                return `<span style="display:inline-flex;align-items:center;gap:6px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:13px;margin:2px 4px 2px 0">
                    ${name}
                    <span onclick="removeFromCompare('${id}')" style="cursor:pointer;color:var(--text-muted);font-size:11px">&#x2715;</span>
                </span>`;
            }).join('');
        }

        function addToCompare(id, name) {
            if (compareIds.includes(id)) { showToast('Already added', 'warning'); return; }
            if (compareIds.length >= 4) { showToast('You can compare up to 4 products', 'warning'); return; }
            compareIds.push(id);
            compareNames[id] = name || id;
            renderCompareList();
            showToast('Added to compare', 'success');
        }

        function removeFromCompare(id) {
            const idx = compareIds.indexOf(id);
            if (idx > -1) compareIds.splice(idx, 1);
            delete compareNames[id];
            renderCompareList();
            if (!compareIds.length) document.getElementById('compare-table').innerHTML = '';
        }

        function clearCompare() {
            compareIds.length = 0;
            Object.keys(compareNames).forEach(k => delete compareNames[k]);
            renderCompareList();
            document.getElementById('compare-table').innerHTML = '';
        }

        async function runCompare() {
            if (!compareIds.length) { showToast('Select products to compare', 'warning'); return; }
            const res = await apiFetch(`/products/compare?ids=${compareIds.join(',')}`);
            if (!res?.ok) { showToast('Failed to compare products', 'error'); return; }
            const json = await res.json();
            renderCompareTable(json.data || []);
        }

        function renderCompareTable(products) {
            if (!products.length) {
                document.getElementById('compare-table').innerHTML = '<p>No products found.</p>';
                return;
            }
            const headers = products.map(p => {
                const firstImageUrl = (p.product_details || []).find(d => d.image_url)?.image_url || null;
                const img = firstImageUrl
                    ? `<img src="${firstImageUrl}" alt="Product" style="width:200px;height:200px;object-fit:contain;border-radius:10px;border:1px solid #e6e7eb" />`
                    : `<div class="prod-img" style="width:72px;height:72px;display:flex;align-items:center;justify-content:center;font-size:28px">💻</div>`;
                return `<th style="text-align:left">${img}</th>`;
            }).join('');
            const row = (label, fn) => `<tr><td><strong>${label}</strong></td>${products.map(fn).join('')}</tr>`;
            const listingsRow = products.map(p => {
                const listings = (p.product_details || []).map(d => `${d.source}: ${d.price != null ? fmtPrice(d.price) : '—'}`).join('<br>');
                return `<td>${listings || '—'}</td>`;
            }).join('');
            const table = `
                <table class="detail-table">
                  <tr><th></th>${headers}</tr>
                  ${row('Brand', p => `<td>${p.brand || '—'}</td>`)}
                  ${row('Series', p => `<td>${p.series || '—'}</td>`)}
                  ${row('Processor', p => `<td>${normalizeProcessor(p.processor)}</td>`)}
                  ${row('RAM', p => `<td>${p.ram || '—'}</td>`)}
                  ${row('Storage', p => `<td>${p.storage || '—'}</td>`)}
                  ${row('Screen Size', p => `<td>${p.screen_size || '—'}</td>`)}
                  ${row('Graphics', p => `<td>${p.graphic_processor || '—'}</td>`)}
                  ${row('Colour', p => `<td>${p.colour || '—'}</td>`)}
                  <tr><td><strong>Listings</strong></td>${listingsRow}</tr>
                </table>`;
            document.getElementById('compare-table').innerHTML = table;
        }


        //  CHATBOT — WebSocket
        let ws = null;
        let wsConnected = false;
        let currentSessionId = null;
        let chatSessionsLoaded = false;
        const sessionFirstQuestionMap = {};

        function getSessionDisplayTitle(session) {
            const mappedTitle = sessionFirstQuestionMap[session.id];
            if (mappedTitle) return mappedTitle;

            const rawTitle = (session.title || '').trim();
            if (!rawTitle || rawTitle.toLowerCase() === 'new chat') {
                return `Chat ${new Date(session.created_at).toLocaleString()}`;
            }
            return rawTitle;
        }

        async function ensureChatReady() {
            if (!chatSessionsLoaded) {
                await loadChatSessions();
                chatSessionsLoaded = true;
            }
            if (!currentSessionId) {
                await createNewChatSession();
                return;
            }
            await loadChatMessages(currentSessionId);
            reconnectWS();
        }

        async function loadChatSessions() {
            const res = await apiFetch('/ws/sessions');
            if (!res?.ok) {
                showToast('Failed to load chat sessions', 'error');
                return;
            }
            const data = await res.json();
            const sessions = data.sessions || [];
            renderChatSessions(sessions);
            if (!currentSessionId && sessions.length) {
                currentSessionId = sessions[0].id;
            }
        }

        function renderChatSessions(sessions) {
            const el = document.getElementById('chat-sessions-list');
            if (!sessions.length) {
                el.innerHTML = '<div style="padding:10px;font-size:12px;color:var(--text-muted)">No chats yet</div>';
                return;
            }
            el.innerHTML = sessions.map(s => {
                const active = s.id === currentSessionId;
                const title = getSessionDisplayTitle(s);
                return `<button onclick="selectChatSession('${s.id}')" style="width:100%;text-align:left;border:1px solid ${active ? 'var(--accent)' : 'var(--border)'};background:${active ? 'var(--accent-light)' : 'var(--surface)'};border-radius:8px;padding:8px 10px;margin-bottom:6px;cursor:pointer;font-size:12px;color:var(--text)">${escapeHtml(title)}</button>`;
            }).join('');
        }

        async function createNewChatSession() {
            const res = await apiFetch('/ws/session', {
                method: 'POST',
                body: JSON.stringify({ title: 'New Chat' })
            });
            if (!res?.ok) {
                showToast('Failed to create chat session', 'error');
                return;
            }
            const session = await res.json();
            currentSessionId = session.id;
            await loadChatSessions();
            clearChat();
            reconnectWS();
        }

        async function selectChatSession(sessionId) {
            currentSessionId = sessionId;
            await loadChatSessions();
            await loadChatMessages(sessionId);
            reconnectWS();
        }

        async function loadChatMessages(sessionId) {
            const res = await apiFetch(`/ws/messages?session_id=${encodeURIComponent(sessionId)}`);
            if (!res?.ok) {
                showToast('Failed to load chat messages', 'error');
                return;
            }
            const data = await res.json();
            const messages = data.messages || [];
            const msgs = document.getElementById('chat-messages');
            msgs.innerHTML = '';
            if (!messages.length) {
                clearChat();
                return;
            }

            // If backend title is still "New Chat", derive UI title from first user message.
            if (!sessionFirstQuestionMap[sessionId]) {
                const firstUserMsg = messages.find(
                    m => m.sender === 'USER' && (m.message && m.message.text)
                );
                if (firstUserMsg?.message?.text) {
                    sessionFirstQuestionMap[sessionId] = firstUserMsg.message.text.trim();
                    await loadChatSessions();
                }
            }

            messages.forEach(m => {
                if (m.sender === 'USER') {
                    appendUserMsg((m.message && m.message.text) || '');
                } else {
                    const products = m.message?.products;
                    if (Array.isArray(products) && products.length) {
                        appendProductsMsg(products);
                    }
                }
            });
        }

        function initWebSocket() {
            if (!currentSessionId) {
                return;
            }
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            const url = `${proto}://${location.host}/api/v1/ws/chat?token=${token}&session_id=${encodeURIComponent(currentSessionId)}`;
            setStatus('Connecting…', '#F59E0B');

            try {
                ws = new WebSocket(url);
            } catch (e) {
                handleWSUnavailable();
                return;
            }

            ws.onopen = () => {
                wsConnected = true;
                setStatus('Connected', 'var(--success)');
                document.getElementById('chat-input').disabled = false;
                document.getElementById('chat-send-btn').disabled = false;
                document.getElementById('reconnect-btn').style.display = 'none';
            };

            ws.onmessage = (evt) => {
                removeTyping();
                try {
                    const products = JSON.parse(evt.data);
                    if (Array.isArray(products) && products.length) {
                        appendProductsMsg(products);
                    } else if (Array.isArray(products) && products.length === 0) {
                        appendBotMsg('No matching products found. Try a different query.');
                    } else if (products?.error) {
                        appendBotMsg(products.error);
                    } else {
                        appendBotMsg('No matching products found. Try a different query.');
                    }
                } catch {
                    appendBotMsg(evt.data);
                }
            };

            ws.onerror = () => { handleWSUnavailable(); };
            ws.onclose = (evt) => {
                wsConnected = false;
                document.getElementById('chat-input').disabled = true;
                document.getElementById('chat-send-btn').disabled = true;
                if (evt.code === 4001) {
                    setStatus('Session expired', 'var(--danger)');
                    document.getElementById('reconnect-btn').style.display = 'none';
                    appendBotMsg('⚠️ Your session has expired. Please log in again to use the chatbot.');
                } else {
                    setStatus('Disconnected', 'var(--danger)');
                    document.getElementById('reconnect-btn').style.display = 'inline-flex';
                }
            };
        }

        function handleWSUnavailable() {
            wsConnected = false;
            setStatus('Chatbot not available', 'var(--danger)');
            document.getElementById('chat-input').disabled = true;
            document.getElementById('chat-send-btn').disabled = true;
            document.getElementById('reconnect-btn').style.display = 'inline-flex';
            appendBotMsg('⚠️ The chatbot service is currently unavailable. Please try reconnecting or browse products from preferred products.');
        }

        function reconnectWS() { if (ws) { try { ws.close(); } catch { } ws = null; } initWebSocket(); }
        function setStatus(txt, color) {
            const el = document.getElementById('chat-status-text');
            el.textContent = txt;
            el.style.color = color;
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text || !wsConnected || !currentSessionId) return;

            // Update sidebar title to first asked question for this session (frontend only).
            if (!sessionFirstQuestionMap[currentSessionId]) {
                sessionFirstQuestionMap[currentSessionId] = text;
                loadChatSessions();
            }

            appendUserMsg(text);
            appendTyping();
            ws.send(text);
            input.value = '';
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('chat-input').addEventListener('keydown', e => {
                if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChatMessage(); }
            });
        });

        function msgTime() { return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }

        function appendUserMsg(text) {
            const msgs = document.getElementById('chat-messages');
            msgs.innerHTML += `<div class="msg user-msg">
    <div class="msg-avatar">${(localStorage.getItem('username') || 'U')[0].toUpperCase()}</div>
    <div><div class="msg-bubble">${escapeHtml(text)}</div><span class="msg-time">${msgTime()}</span></div>
  </div>`;
            msgs.scrollTop = msgs.scrollHeight;
        }

        function appendBotMsg(text) {
            const msgs = document.getElementById('chat-messages');
            msgs.innerHTML += `<div class="msg bot-msg">
    <div class="msg-avatar">🤖</div>
    <div><div class="msg-bubble">${text}</div><span class="msg-time">${msgTime()}</span></div>
  </div>`;
            msgs.scrollTop = msgs.scrollHeight;
        }

        function appendProductsMsg(products) {
            const msgs = document.getElementById('chat-messages');
            const cards = products.map(p => {
                const img = p.image_url
                    ? `<img class="cp-img" src="${p.image_url}" alt="Product" style="width:150px;height:150px;object-fit:contain;border-radius:8px;border:1px solid #e6e7eb" />`
                    : `<div class="cp-img">💻</div>`;
                const brandSeries = [p.brand, p.series].filter(Boolean).join(' ') || '—';
                let sourcesHtml = '';
                if (Array.isArray(p.sources) && p.sources.length) {
                    sourcesHtml = `<div class="cp-price">` +
                        p.sources.map(s => {
                            const priceText = s.price != null ? ` - ${fmtPrice(s.price)}` : '';
                            return s.url
                                ? `<a href="${s.url}" target="_blank" style="color:var(--accent);text-decoration:underline;margin-right:8px">${escapeHtml(s.source)}</a>${priceText}`
                                : `<span style="margin-right:8px">${escapeHtml(s.source)}${priceText}</span>`;
                        }).join('') + `</div>`;
                }
                return `<div class="chat-product-card">
      ${img}
      <div class="cp-body">
                <div class="cp-name">${escapeHtml(brandSeries)}</div>
                ${sourcesHtml}
                ${p.rating != null ? `<div class="cp-rating">⭐ ${p.rating}/5</div>` : ''}
      </div>
    </div>`;
            }).join('');

            msgs.innerHTML += `<div class="msg bot-msg">
    <div class="msg-avatar">🤖</div>
    <div>
      <div class="msg-bubble">Showing top best matched product${products.length > 1 ? 's' : ''}:
        <div class="chat-products-grid">${cards}</div>
      </div>
      <span class="msg-time">${msgTime()}</span>
    </div>
  </div>`;
            msgs.scrollTop = msgs.scrollHeight;
        }

        function appendTyping() {
            const msgs = document.getElementById('chat-messages');
            msgs.innerHTML += `<div class="msg bot-msg" id="typing-indicator">
    <div class="msg-avatar">🤖</div>
    <div class="typing-indicator"><span></span><span></span><span></span></div>
  </div>`;
            msgs.scrollTop = msgs.scrollHeight;
        }
        function removeTyping() { document.getElementById('typing-indicator')?.remove(); }

        function clearChat() {
            document.getElementById('chat-messages').innerHTML = `<div class="msg bot-msg">
    <div class="msg-avatar">🤖</div>
    <div><div class="msg-bubble">Chat cleared. What are you looking for?</div><span class="msg-time">${msgTime()}</span></div>
  </div>`;
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        //  LOGOUT
        async function logout() {
            try { await apiFetch('/auth/logout', { method: 'POST' }); } catch { }
            if (ws) { try { ws.close(); } catch { } }
            localStorage.clear(); window.location.href = '/ui/login';
        }

        //  INIT
        loadProducts(1);
        renderCompareList();
    </script>
</body>

</html>
